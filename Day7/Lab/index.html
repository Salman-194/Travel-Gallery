
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Billing</title>
</head>
<body>

    <h1>Smart Billing</h1>

<h2>Calculate Your Bill</h2>

<label for="quantity">Enter Quantity:</label>
<input type="number" id="quantity" min="1" placeholder="Enter quantity">

<button id="billButton">Calculate Bill</button>

<p id="output"></p>

<hr>

<h2>Grade Checker</h2>

<label for="marks">Enter Marks:</label>
<input type="number" id="marks" min="0" max="100" placeholder="Enter marks">

<button id="gradeButton">Check Grade</button>

<p id="gradeOutput"></p>

    <script src="script.js"></script>
</body>
</html>
