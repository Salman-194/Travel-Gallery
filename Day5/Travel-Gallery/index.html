<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
<header class="header">
    <h1>Travel Gallery</h1>
</header>
<aside class="sidebar">
    <h2>Menu</h2>

    <ul>
        <li>Beaches</li>
        <li>Mountains</li>
        <li>Cities</li>
    </ul>
</aside>
<main class="gallery">

    <article class="card featured">
        <h3>Goa</h3>
        <img src="Images/goa.jpg" alt="Beautiful Goa beach">
        <p>Golden beaches</p>
    </article>

    <article class="card">
        <h3>Ooty</h3>
        <img src="Images/ooty.jpg" alt="Beautiful Ooty hill station">
        <p>Misty hills</p>
    </article>

    <article class="card">
        <h3>Jaipur</h3>
        <img src="Images/jaipur.jpg" alt="Jaipur Hawa Mahal">
        <p>Pink city</p>
    </article>

    <article class="card">
        <h3>Munnar</h3>
        <img src="Images/munnar.jpg" alt="Munnar tea gardens">
        <p>Tea gardens</p>
    </article>

    <article class="card">
        <h3>Kochi</h3>
        <img src="Images/kochi.jpg" alt="Kochi Chinese fishing nets">
        <p>Beautiful backwaters</p>
    </article>

    <article class="card">
        <h3>Shimla</h3>
        <img src="Images/shimla.jpg" alt="Shimla snowy mountains">
        <p>Snowy mountain views</p>
    </article>

</main>
<footer class="footer">
    <p>© 2026 Travel Gallery. All Rights Reserved.</p>
</footer>
</div>
</body>
</html>
